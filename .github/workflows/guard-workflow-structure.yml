# Guards the review workflow's structure, from outside it.
#
# **Why this is a separate workflow rather than a step in the file it checks.** The check
# asserts the job set, `runs-on`, `steps` and the absence of a duplicate `permissions:` key.
# All of those fail *closed* only if something runs: if a change breaks the review workflow's
# YAML, that workflow never starts, so a step inside it can never report the break. **A guard
# embedded in the artifact it guards cannot detect a fault that stops the artifact running.**
# That is the reason for the separate file, and it is not satisfied by placing a step
# carefully inside the other workflow.
#
# **Requirement 1 — ordering.** The checkout below precedes the check, so
# `.github/scripts/check-workflow-structure.mjs` exists on the runner before it is read. The
# Android guard failed on every run after its merge because its step ran before its checkout;
# no local run could see that, because a local run has the files on disk.
#
# **Requirement 2 — not behind a skip.** This workflow has no `paths:` filter and no internal
# skip, so it runs on the PRs that change `.github/**`, which are the only ones that can break
# the file it guards. A guard that stands down on exactly those PRs protects nothing.
#
# **Requirement 3 — the dependency is declared at the point of use.** The step below names the
# checkout it depends on. A step that reads a file depends on the step that put it there, and
# nothing in the YAML says so unless it is written down.

name: Guard workflow structure

# **The trigger set is wider than the review workflow's and the asymmetry is deliberate.**
# The review workflow was narrowed to `ready_for_review` because running a model on every push
# is the cost this change set exists to remove. A guard must fire whenever the file it guards
# could have changed, so it keeps `synchronize` and `reopened` — a push that breaks the
# workflow's structure must fail here rather than wait for a review that will not be requested.
# Reading the narrower trigger set next door and treating this one as a regression is the
# mistake this comment exists to prevent.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  guard-structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Produces the file the next step reads. Named here because the dependency is real and
      # invisible: without this checkout the check fails with "no such file", which reads as a
      # broken check rather than a missing file.
      #
      # **This is the only checkout in the workflow, and it comes first. A second one added
      # later would break the steps above it**, because an `actions/checkout` with no `path:`
      # lands at the workspace root with `clean` defaulting to true and runs `git clean -ffdx`
      # there. That would remove nothing today — `.github/scripts/` is tracked — but the same
      # default removes any untracked path a guard creates, and **a step that then finds no
      # files reports a missing file rather than a bug.** Declared here rather than at the
      # place it would bite, because the place it would bite is a step nobody has written yet.
      - name: Checkout repository (produces .github/scripts/ for the step below)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # **Both `run:` steps here are bare commands, and that is load-bearing.** A step's status
      # is the status of its last command, so with no pipe or redirect the job reports the
      # check's own exit code. Add `| tee` or a redirect to either one and the status becomes
      # the pipeline's instead: the check would still print its failure and the step would still
      # report success, which is worse than printing nothing, because the line a reader stops on
      # is the one that agrees with what they expected. Verified: the check exits 1 with the
      # permission stripped, and reading `$?` from a `tail` pipe reports 0 for the same run.
      - name: Assert the review workflow's structure
        run: node .github/scripts/check-workflow-structure.mjs

      # The checks themselves. They cover the structure assertions and the review-control
      # logic, and they are run here because no other workflow invokes them: a check with no
      # execution path is an assertion nobody has made.
      - name: Run the review-control checks
        run: node --test .github/scripts/claude-review.test.mjs
