# Reviews at a deliberate point rather than on every push.
#
# This workflow is shared between the Android, iOS, and Web Player repos. The
# mechanics match `auris-android` and `auris-core` — same triggers, preflight,
# guards and status recording — so the three repos behave identically. If you
# change the mechanics here, check whether the other two need the same change.
#
# Automatic review runs only on `ready_for_review`. `opened`, `synchronize` and
# `reopened` are deliberately absent: a PR opened non-draft requests a review with
# an exact `/review` comment after the lane's own reviews pass, so draft-first
# stays a convenience rather than becoming mandatory. The cost this removes is not
# the draft pushes — it is every push, which is where the runs were going.
#
# A successful review is recorded as a commit status named `Claude review` on the
# reviewed SHA. Freshness is therefore a fact about a commit rather than a note
# about a PR: a later commit inherits nothing, and a `/review` on an
# already-reviewed head is skipped rather than repeated.
#
# **The status records a COMPLETED review, not approval.** Neither an action
# failure nor a model failure may produce success, and a skipped review must not
# read as a completed one — that was observed live, as a green check for a review
# that never ran.

name: Claude Code Review

on:
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]

# Serialize requests for one PR; a newer explicit request supersedes the old one.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Cheap event filter; current permissions and PR state are checked in the preflight
    # below, before any model access.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.comment.body == '/review')

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # Required to record the `Claude review` commit status on the reviewed head.
      statuses: write
      # Unused while github_token is passed below (App OIDC exchange skipped).
      id-token: write
    steps:
      # The preflight runs the repo's own review-control script out of the trusted
      # default branch, so the rules cannot be changed by the PR being reviewed.
      # It answers, in order: was review requested by an eligible event; does the
      # commenter hold write-or-better NOW; is the PR open, non-draft, same-repo and
      # not a bot; is the ready event for the head that is actually current; has this
      # head already completed a review; and does the PR touch this workflow or its
      # script (in which case it cannot be reviewed by it).
      - name: Checkout trusted review control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Authorize and pin review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .github/scripts/claude-review.mjs "$RUNNER_TEMP/claude-review.mjs"
          node "$RUNNER_TEMP/claude-review.mjs" prepare

      - name: Require configured review model
        if: steps.review.outputs.run == 'true'
        env:
          REVIEW_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
        run: |
          if [ -z "$REVIEW_MODEL" ]; then
            echo '::error::ANTHROPIC_MODEL must be configured; no model substitution is permitted.'
            exit 1
          fi

      - name: Checkout reviewed head
        if: steps.review.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.review.outputs.head }}
          fetch-depth: 0

      - name: Save immutable review diff
        if: steps.review.outputs.run == 'true'
        env:
          REVIEW_BASE: ${{ steps.review.outputs.base }}
          REVIEW_HEAD: ${{ steps.review.outputs.head }}
        run: git diff "$REVIEW_BASE...$REVIEW_HEAD" > "$RUNNER_TEMP/claude-review.diff"

      - name: Run Claude Code Review
        if: steps.review.outputs.run == 'true'
        id: claude-review
        uses: anthropics/claude-code-action@833fb0f8c9f6686b33d963a8bae0a94f4936ab2a # v1.0.211
        env:
          # Anthropic-compatible gateway (Auris). Sourced from secrets for uniformity.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Skip Claude GitHub App install; use Actions token for GitHub API.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ steps.review.outputs.number }}
            REVIEWED HEAD: ${{ steps.review.outputs.head }}
            REVIEWED BASE: ${{ steps.review.outputs.base }}

            Review only the pinned head above. Its immutable diff is saved at
            ${{ runner.temp }}/claude-review.diff. Read that diff, not a fresh
            gh pr diff (the PR may have moved). Fetch files at the pinned commit.
            Record the reviewed head in your summary. If the live PR head differs,
            stop without posting a verdict or inline findings on another head.

            Read AGENTS.md first - it carries this repo's conventions.

            Priorities, in order:
            1. Correctness - bugs reachable from real user flows: wrong logic,
               unhandled states, races and threading violations, object lifetime
               and retain issues, leaks.
            2. Unintended behaviour change - anything the diff changes that the
               description does not claim to change.
            3. Security and privacy - untrusted input reaching queries, parsers or
               the filesystem; secrets or user data in logs.
            4. Performance - only where the impact is user-visible.

            Comments:
            - Open a blocking correctness or behaviour-change finding with its
              user-facing impact in one plain sentence: what breaks, for which
              user, and when, and then the code mechanism, the problem and the
              fix.
            - Keep comments short by default - a few sentences stating the problem
              and the fix, not the reasoning that led you there. Spend more words
              only where the finding needs them to be actionable: a subtle race, a
              non-obvious call path, a concrete repro.
            - Start a comment with "(nit)" for a trivial suggestion, and
              "(non-blocking)" for something worth knowing that should not hold up
              the merge. An unprefixed comment means it blocks.
            - At most three "(nit)"/"(non-blocking)" comments between them. Blocking
              findings are uncapped.
            - Raise a pre-existing issue only if this PR makes it reachable, more
              likely, or harder to fix later - and say which.
            - Never comment to confirm code is correct, restate the diff, or praise it.
            - Never describe a command you did not run or a file you did not read.

            Do not comment on what other CI already checks: formatting and lint, PR
            hygiene (labels, milestone, description, CHANGELOG presence), or whether
            tests pass.

            Output:
            - Inline comments for anything anchored to a line.
            - One summary comment:
              - Two to four sentences of verdict. No preamble, no restating the PR.
              - Then the findings grouped under `### Blocking`, `### Non-blocking`,
                `### Nits`. Skip a group that is empty; skip the section entirely if
                there are no findings, leaving the verdict as the whole summary.
              - One line per finding: `path/to/file:123` followed by a single
                sentence that leads with the user-facing impact, then the fix -
                enough to act on without opening the thread. Add the inline
                comment's URL when you have one.
              - A finding with no line to anchor to takes the same shape with just
                the path, or no path when it is repo-wide.
            - No tables, no re-analysis, no checklist of what you read, no praise.

            If new commits arrived since your last review on this PR:
            - Review only what changed since then.
            - Re-raise an earlier finding only if it is still open - one line, linking
              the existing thread rather than restating it.
            - If nothing new and nothing open, say so in one sentence and stop.

          claude_args: |
            --model ${{ secrets.ANTHROPIC_MODEL }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(cat:*),Bash(git show:*),Bash(git diff:*),Bash(gh pr view:*)"

      # The status records a COMPLETED review, not approval: it requires the action to
      # have succeeded AND the model to have reported success. A skip or a failure is an
      # error status, never silence — silence is what let a green check stand for a
      # review that never ran.
      - name: Record reviewed head
        if: always() && steps.review.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_NUMBER: ${{ steps.review.outputs.number }}
          REVIEW_HEAD: ${{ steps.review.outputs.head }}
          REVIEW_OUTCOME: ${{ steps.claude-review.outcome }}
          MODEL_CONCLUSION: ${{ steps.claude-review.outputs.conclusion }}
        run: node "$RUNNER_TEMP/claude-review.mjs" finish
